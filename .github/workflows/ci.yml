name: CHNeoWave quality gate

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run tests
        run: python -m pytest --cov=hrneowave --cov-report=term-missing

      - name: Check critical code quality
        run: >-
          python -m ruff check
          src/hrneowave/acquisition/acquisition_controller.py
          src/hrneowave/acquisition/daq_backend.py
          src/hrneowave/acquisition/hardware_qualification.py
          src/hrneowave/acquisition/qualification_protocol.py
          src/hrneowave/acquisition/mcc_daq_wrapper.py
          src/hrneowave/acquisition/session_exporter.py
          src/hrneowave/acquisition/session_recorder.py
          src/hrneowave/core/post_processor.py
          src/hrneowave/core/wave_analysis.py
          src/hrneowave/gui/main_window.py
          src/hrneowave/gui/views/acquisition_config_view.py
          src/hrneowave/gui/views/calibration_view.py
          src/hrneowave/gui/widgets/qualification_workspace.py
          src/hrneowave/hardware
          scripts/mcc_hardware_probe.py
          scripts/qualify_hardware_session.py
          tests
